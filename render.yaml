services:
  - type: web
    name: sidequest-tt-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/docs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: sidequest
      - key: FRONTEND_ORIGIN
        sync: false
      - key: VERIFICATION_WORKER_SECRET
        sync: false
      - key: VERIFICATION_LEASE_SECONDS
        value: "120"
